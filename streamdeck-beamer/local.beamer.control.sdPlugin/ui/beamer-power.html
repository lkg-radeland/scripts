<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Adresse">
			<sdpi-textfield
				setting="url"
				default="http://beamer.lan"
				placeholder="http://beamer.lan"
			></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Abfrage">
			<sdpi-range
				setting="pollSeconds"
				default="5"
				min="2"
				max="30"
				step="1"
				showlabels
			></sdpi-range>
		</sdpi-item>

		<sdpi-item label="Hinweis">
			<sdpi-text
				>Die Taste zeigt den Zustand an. Während der Abkühlphase nach dem Ausschalten nimmt der
				Beamer keine Einschaltbefehle an.</sdpi-text
			>
		</sdpi-item>
	</body>
</html>
